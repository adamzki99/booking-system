name: Backend CI

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read



jobs:
  check:
    name: Format, vet, test, build
    concurrency:
      group: ${{ github.workflow }}-check-${{ github.head_ref || github.ref_name }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: product/backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: product/backend/go.mod
          cache-dependency-path: product/backend/go.sum

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Tests
        run: go test -race -shuffle=on -timeout 20m -json ./... > "$RUNNER_TEMP/go-test.json"

      - name: Test report
        if: always()
        run: |
          "$GITHUB_WORKSPACE/dev-ops/scripts/go-test-report.sh" "$RUNNER_TEMP/go-test.json" \
            --require-package auth \
            --require-package booking \
            --require-package eventstore \
            --require-package notification \
            --require-package projection \
            --require-package registry \
            --require-package user

      - name: Build
        run: go build ./cmd/server

  docker:
    name: Docker build smoke test
    concurrency:
      group: ${{ github.workflow }}-docker-${{ github.head_ref || github.ref_name }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: docker build -f product/backend/Dockerfile product/backend
