name: Monitoring CI

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-monitoring
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate factory monitoring
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.x"

      - name: Install validation dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pyyaml pytest

      - name: Run factory validation
        run: dev-ops/factory/validate.sh

      - name: Run monitoring stack validation
        run: dev-ops/factory/monitoring/scripts/validate.sh
