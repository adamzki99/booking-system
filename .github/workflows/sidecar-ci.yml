name: Sidecar CI

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Sidecar tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/sauna/sidecar
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: projects/sauna/sidecar/go.mod
          # The sidecar is stdlib-only and has no go.sum, so there is no
          # module cache to restore. Re-enable with cache-dependency-path
          # if external dependencies are added.
          cache: false

      - name: Tests
        run: go test ./...
