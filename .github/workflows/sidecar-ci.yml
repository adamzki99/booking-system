name: Sidecar CI

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Sidecar tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/sauna/sidecar
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: projects/sauna/sidecar/go.mod
          # The sidecar is stdlib-only and has no go.sum, so there is no
          # module cache to restore. Re-enable with cache-dependency-path
          # if external dependencies are added.
          cache: false

      - name: Tests
        run: go test ./...
