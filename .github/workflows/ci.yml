name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      sidecar: ${{ steps.filter.outputs.sidecar }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        with:
          filters: |
            backend:
              - 'product/backend/**'
              - '.github/workflows/backend-ci.yml'
              - '.github/workflows/ci.yml'
            frontend:
              - 'product/frontend-solid/**'
              - '.github/workflows/frontend-ci.yml'
              - '.github/workflows/ci.yml'
            sidecar:
              - 'projects/sauna/sidecar/**'
              - '.github/workflows/sidecar-ci.yml'
              - '.github/workflows/ci.yml'

  backend:
    name: Backend CI
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    uses: ./.github/workflows/backend-ci.yml

  frontend:
    name: Frontend CI
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    uses: ./.github/workflows/frontend-ci.yml

  sidecar:
    name: Sidecar CI
    needs: changes
    if: needs.changes.outputs.sidecar == 'true'
    uses: ./.github/workflows/sidecar-ci.yml

  security:
    name: Security
    uses: ./.github/workflows/security.yml

  semgrep:
    name: Semgrep
    uses: ./.github/workflows/semgrep.yml

  ci-gate:
    name: ci-gate
    if: always()
    needs: [changes, backend, frontend, sidecar, security, semgrep]
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate results
        run: '[[ "${{ contains(needs.*.result, ''failure'') || contains(needs.*.result, ''cancelled'') }}" == "false" ]]'