# Persistent SigNoz (APM) stack for dev-ops observability.
#
# Independent project — restarting/redeploying booking environments (which use
# COMPOSE_PROJECT_NAME=booking-*) must not affect this stack.
#
# Bring up:   docker compose -f dev-ops/signoz/docker-compose.yml up -d
# Logs:       docker compose -f dev-ops/signoz/docker-compose.yml logs -f
# Stop:       docker compose -f dev-ops/signoz/docker-compose.yml down
#             (volumes are preserved; data survives reboots/restarts)
#
# OTLP endpoint for booking backends on the same host:
#   OTEL_EXPORTER_OTLP_ENDPOINT=http://host.docker.internal:4318
# (collector ports 4317/4318 are published to the host)
#
# SigNoz UI: http://<host>:3301
#
# Config/images derived from SigNoz deploy patterns (MIT). Pin/upgrade versions
# together with the collector config when updating.

name: signoz

x-common: &common
  restart: unless-stopped
  logging:
    options:
      max-size: 50m
      max-file: "3"

x-clickhouse-defaults: &clickhouse-defaults
  <<: *common
  image: clickhouse/clickhouse-server:25.5.6
  tty: true
  depends_on:
    signoz-init-clickhouse:
      condition: service_completed_successfully
    signoz-zookeeper:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "wget", "--spider", "-q", "0.0.0.0:8123/ping"]
    interval: 30s
    timeout: 5s
    retries: 3
  ulimits:
    nproc: 65535
    nofile:
      soft: 262144
      hard: 262144
  environment:
    - CLICKHOUSE_SKIP_USER_SETUP=1

x-db-depend: &db-depend
  <<: *common
  depends_on:
    signoz-clickhouse:
      condition: service_healthy
    signoz-schema-migrator-sync:
      condition: service_completed_successfully

services:
  signoz-init-clickhouse:
    <<: *common
    image: clickhouse/clickhouse-server:25.5.6
    container_name: signoz-init-clickhouse
    restart: on-failure
    command:
      - bash
      - -c
      - |
        set -e
        version="v0.0.1"
        node_os=$$(uname -s | tr '[:upper:]' '[:lower:]')
        node_arch=$$(uname -m | sed s/aarch64/arm64/ | sed s/x86_64/amd64/)
        echo "Fetching histogram-binary for $${node_os}/$${node_arch}"
        cd /tmp
        wget -O histogram-quantile.tar.gz "https://github.com/SigNoz/signoz/releases/download/histogram-quantile%2F$${version}/histogram-quantile_$${node_os}_$${node_arch}.tar.gz"
        tar -xvzf histogram-quantile.tar.gz
        mv histogram-quantile /var/lib/clickhouse/user_scripts/histogramQuantile
        chmod +x /var/lib/clickhouse/user_scripts/histogramQuantile
    volumes:
      - signoz-user-scripts:/var/lib/clickhouse/user_scripts/

  signoz-zookeeper:
    <<: *common
    image: signoz/zookeeper:3.7.1
    container_name: signoz-zookeeper
    user: root
    volumes:
      - signoz-zookeeper-data:/bitnami/zookeeper
    environment:
      - ZOO_SERVER_ID=1
      - ALLOW_ANONYMOUS_LOGIN=yes
      - ZOO_AUTOPURGE_INTERVAL=1
      - ZOO_ENABLE_PROMETHEUS_METRICS=yes
      - ZOO_PROMETHEUS_METRICS_PORT_NUMBER=9141
    healthcheck:
      test: ["CMD-SHELL", "curl -s -m 2 http://localhost:8080/commands/ruok | grep error | grep null"]
      interval: 30s
      timeout: 5s
      retries: 3

  signoz-clickhouse:
    <<: *clickhouse-defaults
    container_name: signoz-clickhouse
    hostname: signoz-clickhouse
    volumes:
      - signoz-user-scripts:/var/lib/clickhouse/user_scripts/
      - ./clickhouse/cluster.xml:/etc/clickhouse-server/config.d/cluster.xml:ro
      - ./clickhouse/config.xml:/etc/clickhouse-server/config.xml:ro
      - ./clickhouse/custom-function.xml:/etc/clickhouse-server/custom-function.xml:ro
      - ./clickhouse/users.xml:/etc/clickhouse-server/users.xml:ro
      - signoz-clickhouse-data:/var/lib/clickhouse/

  signoz-server:
    <<: *db-depend
    image: signoz/signoz:v0.96.1
    container_name: signoz-server
    command:
      - --config=/root/config/prometheus.yml
    ports:
      - "${SIGNOZ_UI_PORT:-3301}:8080"
    volumes:
      - ./signoz/prometheus.yml:/root/config/prometheus.yml:ro
      - signoz-sqlite:/var/lib/signoz/
    environment:
      - SIGNOZ_ALERTMANAGER_PROVIDER=signoz
      - SIGNOZ_TELEMETRYSTORE_CLICKHOUSE_DSN=tcp://signoz-clickhouse:9000
      - SIGNOZ_SQLSTORE_SQLITE_PATH=/var/lib/signoz/signoz.db
      - STORAGE=clickhouse
      - GODEBUG=netdns=go
      - TELEMETRY_ENABLED=false
      - DEPLOYMENT_TYPE=docker-standalone
      - DOT_METRICS_ENABLED=true
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  signoz-otel-collector:
    <<: *db-depend
    image: signoz/signoz-otel-collector:v0.129.6
    container_name: signoz-otel-collector
    command:
      - --config=/etc/otel-collector-config.yaml
      - --manager-config=/etc/manager-config.yaml
      - --copy-path=/var/tmp/collector-config.yaml
      - --feature-gates=-pkg.translator.prometheus.NormalizeName
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
      - ./signoz/otel-collector-opamp-config.yaml:/etc/manager-config.yaml:ro
    environment:
      - OTEL_RESOURCE_ATTRIBUTES=host.name=signoz-host,os.type=linux
      - LOW_CARDINAL_EXCEPTION_GROUPING=false
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    depends_on:
      signoz-server:
        condition: service_healthy

  signoz-schema-migrator-sync:
    <<: *common
    image: signoz/signoz-schema-migrator:v0.129.6
    container_name: signoz-schema-migrator-sync
    restart: on-failure
    command:
      - sync
      - --dsn=tcp://signoz-clickhouse:9000
      - --up=
    depends_on:
      signoz-clickhouse:
        condition: service_healthy

  signoz-schema-migrator-async:
    <<: *db-depend
    image: signoz/signoz-schema-migrator:v0.129.6
    container_name: signoz-schema-migrator-async
    restart: on-failure
    command:
      - async
      - --dsn=tcp://signoz-clickhouse:9000
      - --up=

volumes:
  signoz-clickhouse-data:
    name: signoz-clickhouse-data
  signoz-sqlite:
    name: signoz-sqlite
  signoz-zookeeper-data:
    name: signoz-zookeeper-data
  signoz-user-scripts:
    name: signoz-user-scripts
