name: factory-monitoring

x-required-env: &required-env
  CLICKHOUSE_COLLECTOR_PASSWORD: ${CLICKHOUSE_COLLECTOR_PASSWORD:?set CLICKHOUSE_COLLECTOR_PASSWORD in .env}
  CLICKHOUSE_GRAFANA_PASSWORD: ${CLICKHOUSE_GRAFANA_PASSWORD:?set CLICKHOUSE_GRAFANA_PASSWORD in .env}
  GRAFANA_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}

services:
  check-env:
    image: alpine:3.24.4
    command:
      - sh
      - -ec
      - |
        [ -n "$${CLICKHOUSE_COLLECTOR_PASSWORD:-}" ] || { echo "missing required secret: CLICKHOUSE_COLLECTOR_PASSWORD" >&2; exit 1; }
        [ -n "$${CLICKHOUSE_GRAFANA_PASSWORD:-}" ] || { echo "missing required secret: CLICKHOUSE_GRAFANA_PASSWORD" >&2; exit 1; }
        [ -n "$${GRAFANA_ADMIN_PASSWORD:-}" ] || { echo "missing required secret: GRAFANA_ADMIN_PASSWORD" >&2; exit 1; }
        echo "env ok"
    environment:
      <<: *required-env
    restart: "no"
    networks:
      - factory-monitoring-net

  clickhouse:
    image: clickhouse/clickhouse-server:26.10.4.207
    restart: unless-stopped
    depends_on:
      check-env:
        condition: service_completed_successfully
    environment:
      CLICKHOUSE_DB: otel
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
      CLICKHOUSE_COLLECTOR_PASSWORD: ${CLICKHOUSE_COLLECTOR_PASSWORD:?set CLICKHOUSE_COLLECTOR_PASSWORD in .env}
      CLICKHOUSE_GRAFANA_PASSWORD: ${CLICKHOUSE_GRAFANA_PASSWORD:?set CLICKHOUSE_GRAFANA_PASSWORD in .env}
      CLICKHOUSE_MAX_SERVER_MEMORY_BYTES: ${CLICKHOUSE_MAX_SERVER_MEMORY_BYTES:-805306368}
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
      - ./clickhouse/config.d:/etc/clickhouse-server/config.d:ro
      - ./clickhouse/users.d/users.xml:/etc/clickhouse-server/users.d/users.xml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping | grep -q 'Ok.'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    deploy:
      resources:
        limits:
          memory: 768m
    networks:
      - factory-monitoring-net

  clickhouse-init:
    image: clickhouse/clickhouse-server:26.10.4.207
    restart: "no"
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      CLICKHOUSE_COLLECTOR_PASSWORD: ${CLICKHOUSE_COLLECTOR_PASSWORD:?set CLICKHOUSE_COLLECTOR_PASSWORD in .env}
      CLICKHOUSE_GRAFANA_PASSWORD: ${CLICKHOUSE_GRAFANA_PASSWORD:?set CLICKHOUSE_GRAFANA_PASSWORD in .env}
      CLICKHOUSE_TTL_DAYS: ${CLICKHOUSE_TTL_DAYS:-400}
      LANGFUSE_CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:-}
    volumes:
      - ./clickhouse/init:/init:ro
      - ./scripts/clickhouse-init.sh:/clickhouse-init.sh:ro
    entrypoint: ["/bin/bash", "/clickhouse-init.sh"]
    networks:
      - factory-monitoring-net

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.165.0
    user: "0:0"
    restart: unless-stopped
    depends_on:
      check-env:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
      clickhouse-init:
        condition: service_completed_successfully
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    environment:
      HOST_NAME: ${HOST_NAME:-factory-host}
      FACTORY_LOG_DIR: /var/log/factory
      CLICKHOUSE_ENDPOINT: tcp://clickhouse:9000?dial_timeout=10s
      CLICKHOUSE_COLLECTOR_PASSWORD: ${CLICKHOUSE_COLLECTOR_PASSWORD:?set CLICKHOUSE_COLLECTOR_PASSWORD in .env}
      LANGFUSE_OTLP_ENDPOINT: ${LANGFUSE_OTLP_ENDPOINT:-http://127.0.0.1:1}
      LANGFUSE_OTLP_AUTH_HEADER: ${LANGFUSE_OTLP_AUTH_HEADER:-Basic ZGlzYWJsZWQ6ZGlzYWJsZWQ=}
    volumes:
      - ./otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
      - otel-file-storage:/var/lib/otelcol/file_storage
      - ${FACTORY_LOG_DIR:-/var/lib/factory-logs}:/var/log/factory:ro
    ports:
      - "127.0.0.1:${OTLP_GRPC_PORT:-4317}:4317"
      - "127.0.0.1:${OTLP_HTTP_PORT:-4318}:4318"
    # The distroless image has no /bin/sh or wget. Collector availability is
    # monitored through its Prometheus target and factory event ingestion.
    deploy:
      resources:
        limits:
          memory: 192m
    networks:
      - factory-monitoring-net

  prometheus:
    image: prom/prometheus:v3.16.0
    restart: unless-stopped
    depends_on:
      check-env:
        condition: service_completed_successfully
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-15d}
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-2GB}
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:9090/-/healthy | grep -q 'Prometheus Server is Healthy.'",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 256m
    networks:
      - factory-monitoring-net

  node-exporter:
    image: prom/node-exporter:v1.13.1
    restart: unless-stopped
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host/root
      - --collector.textfile.directory=/var/lib/node_exporter/textfile_collector
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|run/docker/netns|var/lib/docker/.+)($$|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro,rslave
      - ${FACTORY_METRICS_DIR:-/var/lib/factory-metrics}:/var/lib/node_exporter/textfile_collector:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9100/metrics >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 64m
    networks:
      - factory-monitoring-net

  grafana:
    image: grafana/grafana:13.3.1
    restart: unless-stopped
    depends_on:
      check-env:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_PLUGINS_PREINSTALL: grafana-clickhouse-datasource@4.23.5
      CLICKHOUSE_GRAFANA_PASSWORD: ${CLICKHOUSE_GRAFANA_PASSWORD:?set CLICKHOUSE_GRAFANA_PASSWORD in .env}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-factory-alerts@example.invalid}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-http://127.0.0.1:1/factory-alert}
      GF_SMTP_ENABLED: ${GF_SMTP_ENABLED:-false}
      GF_SMTP_HOST: ${GF_SMTP_HOST:-}
      GF_SMTP_USER: ${GF_SMTP_USER:-}
      GF_SMTP_PASSWORD: ${GF_SMTP_PASSWORD:-}
      GF_SMTP_FROM_ADDRESS: ${GF_SMTP_FROM_ADDRESS:-factory-monitoring@example.invalid}
      GF_SMTP_FROM_NAME: ${GF_SMTP_FROM_NAME:-Factory Monitoring}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "0.0.0.0:${GRAFANA_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health | grep -q 'ok'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256m
    networks:
      - factory-monitoring-net

  langfuse-check-env:
    image: alpine:3.24.4
    profiles: ["langfuse"]
    command:
      - sh
      - -ec
      - |
        [ -n "$${LANGFUSE_NEXTAUTH_SECRET:-}" ] || { echo "missing required secret: LANGFUSE_NEXTAUTH_SECRET" >&2; exit 1; }
        [ -n "$${LANGFUSE_SALT:-}" ] || { echo "missing required secret: LANGFUSE_SALT" >&2; exit 1; }
        [ -n "$${LANGFUSE_ENCRYPTION_KEY:-}" ] || { echo "missing required secret: LANGFUSE_ENCRYPTION_KEY" >&2; exit 1; }
        [ -n "$${LANGFUSE_POSTGRES_PASSWORD:-}" ] || { echo "missing required secret: LANGFUSE_POSTGRES_PASSWORD" >&2; exit 1; }
        [ -n "$${LANGFUSE_REDIS_AUTH:-}" ] || { echo "missing required secret: LANGFUSE_REDIS_AUTH" >&2; exit 1; }
        [ -n "$${LANGFUSE_MINIO_ROOT_PASSWORD:-}" ] || { echo "missing required secret: LANGFUSE_MINIO_ROOT_PASSWORD" >&2; exit 1; }
        [ -n "$${LANGFUSE_CLICKHOUSE_PASSWORD:-}" ] || { echo "missing required secret: LANGFUSE_CLICKHOUSE_PASSWORD" >&2; exit 1; }
        echo "langfuse env ok"
    environment:
      LANGFUSE_NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-}
      LANGFUSE_SALT: ${LANGFUSE_SALT:-}
      LANGFUSE_ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:-}
      LANGFUSE_POSTGRES_PASSWORD: ${LANGFUSE_POSTGRES_PASSWORD:-}
      LANGFUSE_REDIS_AUTH: ${LANGFUSE_REDIS_AUTH:-}
      LANGFUSE_MINIO_ROOT_PASSWORD: ${LANGFUSE_MINIO_ROOT_PASSWORD:-}
      LANGFUSE_CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:-}
    restart: "no"
    networks:
      - factory-monitoring-net

  langfuse-postgres:
    image: postgres:17.9
    profiles: ["langfuse"]
    restart: unless-stopped
    depends_on:
      langfuse-check-env:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: ${LANGFUSE_POSTGRES_PASSWORD:-}
      POSTGRES_DB: langfuse
      PGDATA: /var/lib/postgresql/data
      TZ: UTC
      PGTZ: UTC
    entrypoint: ["/usr/local/bin/langfuse-postgres-entrypoint.sh"]
    command: ["postgres"]
    volumes:
      - langfuse-postgres-data:/var/lib/postgresql/data
      - ./scripts/langfuse-postgres-entrypoint.sh:/usr/local/bin/langfuse-postgres-entrypoint.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse -d langfuse"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256m
    networks:
      - factory-monitoring-net

  langfuse-redis:
    image: redis:7.4.8
    profiles: ["langfuse"]
    restart: unless-stopped
    depends_on:
      langfuse-check-env:
        condition: service_completed_successfully
    command: >
      --requirepass ${LANGFUSE_REDIS_AUTH:-}
      --maxmemory-policy noeviction
    volumes:
      - langfuse-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${LANGFUSE_REDIS_AUTH:-}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 96m
    networks:
      - factory-monitoring-net

  langfuse-minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    profiles: ["langfuse"]
    restart: unless-stopped
    depends_on:
      langfuse-check-env:
        condition: service_completed_successfully
    command: server --address ":9000" --console-address ":9001" /data
    environment:
      MINIO_ROOT_USER: ${LANGFUSE_MINIO_ROOT_USER:-langfuse}
      MINIO_ROOT_PASSWORD: ${LANGFUSE_MINIO_ROOT_PASSWORD:-}
    volumes:
      - langfuse-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256m
    networks:
      - factory-monitoring-net

  langfuse-minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    profiles: ["langfuse"]
    restart: "no"
    depends_on:
      langfuse-minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -ec "
      mc alias set local http://langfuse-minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb -p local/langfuse || true;
      "
    environment:
      MINIO_ROOT_USER: ${LANGFUSE_MINIO_ROOT_USER:-langfuse}
      MINIO_ROOT_PASSWORD: ${LANGFUSE_MINIO_ROOT_PASSWORD:-}
    networks:
      - factory-monitoring-net

  langfuse-worker:
    image: langfuse/langfuse-worker:3.227.1
    profiles: ["langfuse"]
    restart: unless-stopped
    depends_on:
      langfuse-check-env:
        condition: service_completed_successfully
      langfuse-web:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      clickhouse-init:
        condition: service_completed_successfully
      langfuse-postgres:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      langfuse-minio:
        condition: service_healthy
      langfuse-minio-init:
        condition: service_completed_successfully
    environment: &langfuse-env
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      DATABASE_URL: postgresql://langfuse:${LANGFUSE_POSTGRES_PASSWORD:-}@langfuse-postgres:5432/langfuse
      SALT: ${LANGFUSE_SALT:-}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:-}
      TELEMETRY_ENABLED: "false"
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "false"
      CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse:${LANGFUSE_CLICKHOUSE_PASSWORD:-}@clickhouse:9000/langfuse
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_DB: langfuse
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      LANGFUSE_MIGRATION_V4_WRITE_MODE: ${LANGFUSE_MIGRATION_V4_WRITE_MODE:-legacy}
      LANGFUSE_MIGRATION_V4_NATIVE_OTEL_BEHAVIOUR: ${LANGFUSE_MIGRATION_V4_NATIVE_OTEL_BEHAVIOUR:-dual_write}
      LANGFUSE_MIGRATION_V4_ALLOW_PREVIEW_OPT_IN: ${LANGFUSE_MIGRATION_V4_ALLOW_PREVIEW_OPT_IN:-false}
      LANGFUSE_BACKGROUND_MIGRATION_V4_ENABLE_HISTORIC_BACKFILL: ${LANGFUSE_BACKGROUND_MIGRATION_V4_ENABLE_HISTORIC_BACKFILL:-false}
      REDIS_HOST: langfuse-redis
      REDIS_PORT: "6379"
      REDIS_AUTH: ${LANGFUSE_REDIS_AUTH:-}
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${LANGFUSE_MINIO_ROOT_USER:-langfuse}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_ROOT_PASSWORD:-}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${LANGFUSE_MINIO_ROOT_USER:-langfuse}
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_ROOT_PASSWORD:-}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
      LANGFUSE_S3_BATCH_EXPORT_ENABLED: "false"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- 'http://127.0.0.1:3030/api/health?failIfEventPropagationStuck=true' >/dev/null 2>&1 || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512m
    networks:
      - factory-monitoring-net

  langfuse-web:
    image: langfuse/langfuse:3.227.1
    profiles: ["langfuse"]
    restart: unless-stopped
    depends_on:
      langfuse-check-env:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
      clickhouse-init:
        condition: service_completed_successfully
      langfuse-postgres:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      langfuse-minio:
        condition: service_healthy
      langfuse-minio-init:
        condition: service_completed_successfully
    environment:
      <<: *langfuse-env
      NEXTAUTH_URL: ${LANGFUSE_NEXTAUTH_URL:-http://localhost:3001}
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-}
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      LANGFUSE_INIT_ORG_ID: ${LANGFUSE_INIT_ORG_ID:-}
      LANGFUSE_INIT_ORG_NAME: ${LANGFUSE_INIT_ORG_NAME:-}
      LANGFUSE_INIT_PROJECT_ID: ${LANGFUSE_INIT_PROJECT_ID:-}
      LANGFUSE_INIT_PROJECT_NAME: ${LANGFUSE_INIT_PROJECT_NAME:-}
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_INIT_PROJECT_PUBLIC_KEY:-}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_INIT_PROJECT_SECRET_KEY:-}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:-}
      LANGFUSE_INIT_USER_NAME: ${LANGFUSE_INIT_USER_NAME:-}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:-}
    ports:
      - "127.0.0.1:${LANGFUSE_PORT:-3001}:3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- 'http://127.0.0.1:3000/api/public/health?failIfDatabaseUnavailable=true' >/dev/null 2>&1 || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512m
    networks:
      - factory-monitoring-net

volumes:
  clickhouse-data:
  clickhouse-logs:
  prometheus-data:
  grafana-data:
  otel-file-storage:
  langfuse-postgres-data:
    name: ${LANGFUSE_POSTGRES_VOLUME:-factory-monitoring_langfuse-postgres-data}
  langfuse-redis-data:
  langfuse-minio-data:

networks:
  factory-monitoring-net:
    name: ${FACTORY_MONITORING_NETWORK:-factory-monitoring-net}
