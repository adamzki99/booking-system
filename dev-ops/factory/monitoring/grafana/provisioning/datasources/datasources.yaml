apiVersion: 1

datasources:
  - name: ClickHouse
    uid: clickhouse-factory
    type: grafana-clickhouse-datasource
    access: proxy
    isDefault: true
    jsonData:
      host: clickhouse
      port: 9000
      protocol: native
      defaultDatabase: factory
      username: grafana
      secure: false
      traces:
        defaultDatabase: otel
        defaultTable: otel_traces
        otelEnabled: true
        otelVersion: latest
    secureJsonData:
      password: $__env{CLICKHOUSE_GRAFANA_PASSWORD}

  - name: Prometheus
    uid: prometheus-factory
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: false
    jsonData:
      httpMethod: POST
