apiVersion: 1
groups:
  - orgId: 1
    name: factory-alerts
    folder: Factory
    interval: 1m
    rules:
      - uid: factory-silent
        title: Factory silent
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 7200
              to: 0
            datasourceUid: prometheus-factory
            model:
              datasource:
                type: prometheus
                uid: prometheus-factory
              editorMode: code
              expr: time() - factory_tick_last_success_timestamp_seconds
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
              conditions:
                - evaluator:
                    params:
                      - 7200
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
        noDataState: NoData
        execErrState: Error
        for: 10m
        annotations:
          summary: No successful factory tick for more than 2 hours.
          runbook:
            Check factory timer/service, tick logs, and FACTORY_METRICS_DIR textfile freshness. Confirm factory_tick_last_success_timestamp_seconds
            is being updated.
        labels:
          severity: critical
          service: factory
        isPaused: false
      - uid: factory-failing
        title: Factory failing
        condition: F
        data:
          - refId: A
            relativeTimeRange:
              from: 21600
              to: 0
            datasourceUid: clickhouse-factory
            model:
              datasource:
                type: grafana-clickhouse-datasource
                uid: clickhouse-factory
              editorType: sql
              format: 1
              intervalMs: 1000
              maxDataPoints: 43200
              pluginVersion: 4.23.5
              queryType: table
              rawSql:
                "SELECT if(count() >= 3 AND countIf(outcome='failed') * 100.0 / count() > 50, 1, 0) AS value

                FROM factory.runs

                WHERE started_at >= now() - INTERVAL 6 HOUR"
              refId: A
          - refId: B
            relativeTimeRange:
              from: 21600
              to: 0
            datasourceUid: clickhouse-factory
            model:
              datasource:
                type: grafana-clickhouse-datasource
                uid: clickhouse-factory
              editorType: sql
              format: 1
              intervalMs: 1000
              maxDataPoints: 43200
              pluginVersion: 4.23.5
              queryType: table
              rawSql: SELECT if(count() > 0, 1, 0) AS value FROM factory.events FINAL WHERE ts >= now() - INTERVAL 6 HOUR AND event='discovery_failed'
              refId: B
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: C
              type: reduce
          - refId: D
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: D
              type: reduce
          - refId: E
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: $C + $D
              intervalMs: 1000
              maxDataPoints: 43200
              refId: E
              type: math
          - refId: F
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: E
              intervalMs: 1000
              maxDataPoints: 43200
              refId: F
              type: threshold
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - E
                  reducer:
                    params: []
                    type: last
                  type: query
        noDataState: NoData
        execErrState: Error
        for: 15m
        annotations:
          summary: Factory run failure rate > 50% over 6h with >=3 runs, or discovery_failed occurred.
          runbook:
            Inspect Execution Analytics dashboard, recent failed runs, discovery_failed events, gh_op_failed, and factory
            logs. Check GitHub/API auth and quota.
        labels:
          severity: critical
          service: factory
        isPaused: false
      - uid: factory-tick-failed
        title: Factory tick failed
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: prometheus-factory
            model:
              datasource:
                type: prometheus
                uid: prometheus-factory
              editorMode: code
              expr: (factory_tick_last_exit_code != bool 0) or vector(0)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
        noDataState: OK
        execErrState: Error
        for: 0m
        annotations:
          summary: Last factory tick exited non-zero.
          runbook:
            Inspect tick.jsonl and the latest tick_end event. Check guardrail_drift, discovery_failed, git_fetch_failed,
            and agent.run.failed events before retrying.
        labels:
          severity: critical
          service: factory
        isPaused: false
      - uid: factory-guardrail-drift
        title: Factory guardrail drift
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 7200
              to: 0
            datasourceUid: clickhouse-factory
            model:
              datasource:
                type: grafana-clickhouse-datasource
                uid: clickhouse-factory
              editorType: sql
              format: 1
              intervalMs: 1000
              maxDataPoints: 43200
              pluginVersion: 4.23.5
              queryType: table
              rawSql: SELECT if(count() > 0, 1, 0) AS value FROM factory.events FINAL WHERE ts >= now() - INTERVAL 2 HOUR AND event='guardrail_drift'
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
        noDataState: NoData
        execErrState: Error
        for: 0m
        annotations:
          summary: Guardrail drift detected in the last tick/window.
          runbook:
            Stop automated merges if needed. Inspect guardrail_drift event payload and diff AGENTS.md/opencode.jsonc/.opencode/agents
            against factory-config tag.
        labels:
          severity: critical
          service: factory
        isPaused: false
      - uid: factory-stuck-run
        title: Factory stuck run
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 7200
              to: 0
            datasourceUid: clickhouse-factory
            model:
              datasource:
