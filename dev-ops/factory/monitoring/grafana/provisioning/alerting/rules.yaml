                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
        noDataState: NoData
        execErrState: Error
        for: 5m
        annotations:
          summary: A factory run has been started but not ended for more than 3900s.
          runbook:
            Check factory.stuck_runs view, session logs, opencode process on host, and whether tick was interrupted. Do
            not delete logs before diagnosis.
        labels:
          severity: warning
          service: factory
        isPaused: false
      - uid: factory-issue-looping
        title: Factory issue looping
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 86400
              to: 0
            datasourceUid: clickhouse-factory
            model:
              datasource:
                type: grafana-clickhouse-datasource
                uid: clickhouse-factory
              editorType: sql
              format: 1
              intervalMs: 1000
              maxDataPoints: 43200
              pluginVersion: 4.23.5
              queryType: table
              rawSql:
                "SELECT if(max(runs) > 3, 1, 0) AS value FROM (\n  SELECT issue_id, count() AS runs\n  FROM factory.runs\n\
                \  WHERE started_at >= now() - INTERVAL 24 HOUR AND issue_id IS NOT NULL\n  GROUP BY issue_id\n)"
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
        noDataState: NoData
        execErrState: Error
        for: 10m
        annotations:
          summary: An issue has more than 3 factory runs in 24h.
          runbook:
            Inspect Execution Analytics for the issue, failure reasons, PR feedback, and whether the issue needs human
            clarification or owner intervention.
        labels:
          severity: warning
          service: factory
        isPaused: false
      - uid: factory-quota-pressure
        title: Factory quota pressure
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 86400
              to: 0
            datasourceUid: clickhouse-factory
            model:
              datasource:
                type: grafana-clickhouse-datasource
                uid: clickhouse-factory
              editorType: sql
              format: 1
              intervalMs: 1000
              maxDataPoints: 43200
              pluginVersion: 4.23.5
              queryType: table
              rawSql:
                "SELECT if(countIf(event='agent.run.failed' AND failure_reason IN ('usage_filled','usage_filled_skipped')) > 0 OR countIf(event='agent.run.started' AND fallback_level = 'free') > 2, 1, 0) AS value

                FROM factory.events FINAL

                WHERE ts >= now() - INTERVAL 24 HOUR AND event IN ('agent.run.failed','agent.run.started')"
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
        noDataState: NoData
        execErrState: Error
        for: 0m
        annotations:
          summary: Usage filled or excessive free retries detected in 24h.
          runbook:
            Check Cost & Efficiency and Execution dashboards for usage-filled agent.run.failed events and agent.run.started
            runs with fallback_level=free, then confirm OpenCode quota state.
        labels:
          severity: warning
          service: factory
        isPaused: false
      - uid: factory-deploy-failed
        title: Factory deploy failed/stale
        condition: F
        data:
          - refId: A
            relativeTimeRange:
              from: 93600
              to: 0
            datasourceUid: clickhouse-factory
            model:
              datasource:
                type: grafana-clickhouse-datasource
                uid: clickhouse-factory
              editorType: sql
              format: 1
              intervalMs: 1000
              maxDataPoints: 43200
              pluginVersion: 4.23.5
              queryType: table
              rawSql: SELECT if(count() > 0, 1, 0) AS value FROM factory.events FINAL WHERE ts >= now() - INTERVAL 26 HOUR AND event='deploy.failed'
              refId: A
          - refId: B
            relativeTimeRange:
              from: 93600
              to: 0
            datasourceUid: clickhouse-factory
            model:
              datasource:
                type: grafana-clickhouse-datasource
                uid: clickhouse-factory
              editorType: sql
              format: 1
              intervalMs: 1000
              maxDataPoints: 43200
              pluginVersion: 4.23.5
              queryType: table
              rawSql:
                SELECT if(countIf(event='deploy.completed') = 0 AND countIf(event='deploy.started') > 0, 1, 0) AS value FROM
                factory.events FINAL WHERE ts >= now() - INTERVAL 26 HOUR AND (event='deploy.completed' OR event='deploy.started')
                AND (deployment_environment='qa' OR attrs['env_name']='qa')
              refId: B
