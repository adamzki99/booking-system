                SELECT if(countIf(event='tick_end' AND ts >= now() - INTERVAL 2 HOUR) = 0, 1, 0) AS value FROM
                factory.events FINAL WHERE ts >= now() - INTERVAL 2 HOUR
              refId: B
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
