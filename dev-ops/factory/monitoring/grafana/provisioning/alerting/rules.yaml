                uid: clickhouse-factory
              editorType: sql
              format: 1
              intervalMs: 1000
              maxDataPoints: 43200
              pluginVersion: 4.23.5
              queryType: table
              rawSql: SELECT if(count() > 0, 1, 0) AS value FROM factory.stuck_runs
