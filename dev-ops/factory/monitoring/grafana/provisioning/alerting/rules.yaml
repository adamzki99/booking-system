          runbook:
            Check collector logs, filelog offsets, ClickHouse ingestion, and factory_telemetry_errors_last. Validate FACTORY_LOG_DIR
            mount and collector health.
        labels:
          severity: warning
          service: factory
        isPaused: false
      - uid: factory-event-ingestion-stale
        title: Factory event ingestion stale
        condition: F
        data:
          - refId: A
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: prometheus-factory
            model:
              datasource:
                type: prometheus
                uid: prometheus-factory
              editorMode: code
              expr: ((time() - factory_tick_last_run_timestamp_seconds) < bool 7200) or vector(0)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            relativeTimeRange:
              from: 7200
