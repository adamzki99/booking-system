# Label → model selection for factory sessions (validated at tick startup).
#
# Top-level keys: labels
# Label entry keys: model (required, non-empty string), backup_model (optional,
# non-empty string). Legacy key "backup" is accepted as alias but not both.
#
# Models are OpenCode model IDs passed to `opencode run --model`. Verify IDs
# against the provider's current model list before changing them.
#
# For build sessions the first matching label in YAML order wins (list heavier
# tiers before lighter ones). "default" is required and used as fallback.
# "plan-task" selects the planning session model.
#
# "backup_model" is used when a session fails due to filled usage/quota and
# tick.sh is in backup mode (--on-usage-filled=backup, default). If omitted,
# the "default" entry's backup_model may be used.

labels:
  # Planning sessions (plan comments on infant issues).
  plan-task:
    model: opencode-go/qwen3.7-plus
    backup_model: opencode/deepseek-v4.1-flash-free
  # Build sessions, by complexity tier (heaviest first):
  heavy-build-task:
    model: opencode-go/kimi-k3.1-pro
    backup_model: opencode/hy4-flash-free
  standard-build-task:
    model: opencode-go/deepseek-v4-pro
    backup_model: opencode/deepseek-v4.1-flash-free
  light-build-task:
    model: opencode-go/claude-haiku-5-5
    backup_model: opencode/hy4-flash-free
  trivial-task:
    model: opencode-go/beam-free
    backup_model: opencode/mimo-v2.6-flash-free
  # Fallback when an issue has no model-selection label.
  default:
    model: opencode-go/deepseek-v4-pro
    backup_model: opencode/deepseek-v4.1-flash-free
