# Optional remote shipper for factory JSONL events.
# Use this when tick.sh runs on a different machine than the factory
# monitoring stack (dev-ops/factory/monitoring/).
#
# It tails the factory JSONL log and ships logs over OTLP/HTTP to the
# factory monitoring collector. It is intended for remote factory hosts that
# need to forward JSONL events to the monitoring stack.
#
# Environment variables:
#   FACTORY_LOG_DIR        - directory containing tick.jsonl (default below)
#   FACTORY_OTLP_ENDPOINT  - OTLP/HTTP endpoint, e.g. http://monitoring-host:4318
#   HOST_NAME              - stable host name reported in telemetry

extensions:
  file_storage:
    directory: ${env:FILE_STORAGE_DIR:-/var/lib/otelcol/file_storage}
    create_directory: true

receivers:
  filelog/factory:
    include:
      - ${env:FACTORY_LOG_DIR:-${env:XDG_STATE_HOME:-/var/lib/factory}/factory}/*.jsonl
      - ${env:FACTORY_LOG_DIR:-${env:XDG_STATE_HOME:-/var/lib/factory}/factory}/*.log
    start_at: beginning
    storage: file_storage
    include_file_path: true
    operators:
      - type: json_parser
        parse_from: body
        parse_to: attributes
        timestamp:
          parse_from: attributes.ts
          layout_type: gotime
          layout: "2006-01-02T15:04:05.000Z07:00"
      - type: move
        from: attributes["service.name"]
        to: resource["service.name"]
        if: 'attributes["service.name"] != nil'
      - type: move
        from: attributes["deployment.environment"]
        to: resource["deployment.environment"]
        if: 'attributes["deployment.environment"] != nil'
      - type: move
        from: attributes["host.name"]
        to: resource["host.name"]
        if: 'attributes["host.name"] != nil'
      - type: move
        from: attributes.factory_id
        to: resource["factory_id"]
        if: "attributes.factory_id != nil"

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 128
  transform/resource:
    error_mode: ignore
    log_statements:
      - context: resource
        statements:
          - set(attributes["host.name"], "${env:HOST_NAME}") where "${env:HOST_NAME}" != ""
          - set(attributes["service.name"], "factory-tick") where attributes["service.name"] == nil
  transform/redact:
    error_mode: ignore
    log_statements:
      - context: log
        statements:
          - delete_key(attributes, "output_tail")
          - delete_key(attributes, "session_output")
          - delete_key(attributes, "prompt")
          - delete_matching_keys(attributes, "(?i)(token|password|secret|authorization|api.?key|passwd|credential|private.?key)")
  batch:
    timeout: 5s
    send_batch_size: 256

exporters:
  otlphttp/factory:
    endpoint: ${env:FACTORY_OTLP_ENDPOINT}

service:
  extensions: [file_storage]
  pipelines:
    logs:
      receivers: [filelog/factory]
      processors: [memory_limiter, transform/resource, transform/redact, batch]
      exporters: [otlphttp/factory]
