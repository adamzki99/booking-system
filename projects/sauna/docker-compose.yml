# Sauna Booking System — deployment compose file.
#
# Combines the generic booking product (../../product) with the sauna-specific
# sidecar and configuration. SigNoz (APM) is deployed separately; the backend
# and frontend emit OTLP telemetry to its collector.

services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "${PORT:-8080}:80"
    volumes:
      - ./config/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - frontend-dist:/srv:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_started
    restart: unless-stopped

  frontend:
    build: ../../product/frontend
    volumes:
      - frontend-dist:/srv
    healthcheck:
      test: ["CMD-SHELL", "test -f /srv/index.html"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: "no"

  backend:
    build: ../../product/backend
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://booking:booking@postgres:5432/booking}
      SIDECAR_URL: ${SIDECAR_URL:-http://sidecar:8081}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-booking-backend}
    depends_on:
      postgres:
        condition: service_healthy
      sidecar:
        condition: service_started
    restart: unless-stopped

  sidecar:
    build: ./sidecar
    environment:
      PORT: "8081"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-booking}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-booking}
      POSTGRES_DB: ${POSTGRES_DB:-booking}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-booking} -d ${POSTGRES_DB:-booking}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  authelia:
    image: authelia/authelia:latest
    profiles: ["authelia"]
    volumes:
      - ./config/authelia:/config:ro
    restart: unless-stopped

volumes:
  caddy-data:
  frontend-dist:
  postgres-data:
