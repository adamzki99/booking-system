global:
  scrape_interval: 15s
  evaluation_interval: 15s

otlp:
  promote_resource_attributes:
    - service.instance.id
    - service.name
    - service.namespace
    - service.version
    - deployment.environment.name
    - deployment.environment
    - project

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]

  - job_name: clickhouse
    static_configs:
      - targets: ["clickhouse:9363"]

  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]

  - job_name: node-exporter
    scrape_interval: 30s
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: postgres-exporter
    scrape_interval: 30s
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: caddy
    scrape_interval: 30s
    static_configs:
      - targets: ["caddy:9180"]
