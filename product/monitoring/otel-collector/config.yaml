extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: ${env:OTEL_MEMORY_LIMIT_MIB:-128}
    spike_limit_mib: 32

  resourcedetection:
    detectors: [env, system]
    system:
      hostname_sources: [os]
      resource_attributes:
        host.name:
          enabled: true

  transform/resource:
    error_mode: ignore
    trace_statements:
      - context: resource
        statements:
          - set(attributes["host.name"], "${env:HOST_NAME}") where "${env:HOST_NAME}" != ""
          - set(attributes["project"], "${env:MONITORING_PROJECT}") where attributes["project"] == nil and "${env:MONITORING_PROJECT}" != ""
    log_statements:
      - context: resource
        statements:
          - set(attributes["host.name"], "${env:HOST_NAME}") where "${env:HOST_NAME}" != ""
          - set(attributes["project"], "${env:MONITORING_PROJECT}") where attributes["project"] == nil and "${env:MONITORING_PROJECT}" != ""
    metric_statements:
      - context: resource
        statements:
          - set(attributes["host.name"], "${env:HOST_NAME}") where "${env:HOST_NAME}" != ""
          - set(attributes["project"], "${env:MONITORING_PROJECT}") where attributes["project"] == nil and "${env:MONITORING_PROJECT}" != ""

  transform/redact:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - replace_pattern(attributes["url.path"], "/calendar/[^/?#]+\\.ics", "/calendar/[REDACTED].ics")
          - replace_pattern(attributes["url.full"], "/calendar/[^/?#]+\\.ics", "/calendar/[REDACTED].ics")
          - replace_pattern(attributes["http.target"], "/calendar/[^/?#]+\\.ics", "/calendar/[REDACTED].ics")
          - replace_pattern(attributes["http.route"], "/calendar/[^/?#]+\\.ics", "/calendar/[REDACTED].ics")
          - delete_key(attributes, "user.email")
          - delete_matching_keys(attributes, "(?i)(token|password|secret|authorization|api.?key|passwd|credential|private.?key)")
    log_statements:
      - context: log
        statements:
          - replace_pattern(attributes["url.path"], "/calendar/[^/?#]+\\.ics", "/calendar/[REDACTED].ics")
          - replace_pattern(attributes["url.full"], "/calendar/[^/?#]+\\.ics", "/calendar/[REDACTED].ics")
          - replace_pattern(attributes["http.target"], "/calendar/[^/?#]+\\.ics", "/calendar/[REDACTED].ics")
          - replace_pattern(attributes["http.route"], "/calendar/[^/?#]+\\.ics", "/calendar/[REDACTED].ics")
          - delete_key(attributes, "user.email")
          - delete_matching_keys(attributes, "(?i)(token|password|secret|authorization|api.?key|passwd|credential|private.?key)")

  filter/health:
    error_mode: ignore
    traces:
      span:
        - 'attributes["url.path"] == "/healthz"'
        - 'attributes["http.route"] == "/healthz"'
        - 'attributes["http.target"] == "/healthz"'
        - 'attributes["url.path"] == "/readyz"'
        - 'attributes["http.route"] == "/readyz"'

  batch:
    timeout: 5s
    send_batch_size: 512

exporters:
  clickhouse/traces:
    endpoint: ${env:CLICKHOUSE_ENDPOINT}
    database: otel
    username: collector
    password: ${env:CLICKHOUSE_COLLECTOR_PASSWORD}
    create_schema: false
    traces_table_name: otel_traces
    logs_table_name: otel_logs
    timeout: 10s
    sending_queue:
      enabled: true
      num_consumers: 2
      queue_size: 1000
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s

  clickhouse/logs:
    endpoint: ${env:CLICKHOUSE_ENDPOINT}
    database: otel
    username: collector
    password: ${env:CLICKHOUSE_COLLECTOR_PASSWORD}
    create_schema: false
    traces_table_name: otel_traces
    logs_table_name: otel_logs
    timeout: 10s
    sending_queue:
      enabled: true
      num_consumers: 2
      queue_size: 1000
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s

  otlphttp/prometheus:
    endpoint: ${env:PROMETHEUS_OTLP_ENDPOINT}
    timeout: 10s
    sending_queue:
      enabled: true
      num_consumers: 2
      queue_size: 1000
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s

service:
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  extensions: [health_check]
  pipelines:
    traces/otlp:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, transform/resource, transform/redact, filter/health, batch]
      exporters: [clickhouse/traces]
    logs/otlp:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, transform/resource, transform/redact, batch]
      exporters: [clickhouse/logs]
    metrics/otlp:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, transform/resource, batch]
      exporters: [otlphttp/prometheus]
