name: ${MONITORING_PROJECT:?set MONITORING_PROJECT in .env}-monitoring

services:
  check-env:
    image: alpine:3.24.4
    command:
      - sh
      - -ec
      - |
        [ -n "$${MONITORING_PROJECT:-}" ] || { echo "missing required env: MONITORING_PROJECT" >&2; exit 1; }
        [ -n "$${CLICKHOUSE_COLLECTOR_PASSWORD:-}" ] || { echo "missing required secret: CLICKHOUSE_COLLECTOR_PASSWORD" >&2; exit 1; }
        [ -n "$${CLICKHOUSE_GRAFANA_PASSWORD:-}" ] || { echo "missing required secret: CLICKHOUSE_GRAFANA_PASSWORD" >&2; exit 1; }
        [ -n "$${GRAFANA_ADMIN_PASSWORD:-}" ] || { echo "missing required secret: GRAFANA_ADMIN_PASSWORD" >&2; exit 1; }
        [ -n "$${GRAFANA_METRICS_PASSWORD:-}" ] || { echo "missing required secret: GRAFANA_METRICS_PASSWORD" >&2; exit 1; }
        umask 077
        mkdir -p /etc/prometheus/secrets
        printf '%s\n' "$${GRAFANA_METRICS_PASSWORD}" > /etc/prometheus/secrets/grafana-metrics-password
        chown 65534:65534 /etc/prometheus/secrets/grafana-metrics-password
        echo "env ok"
    environment:
      MONITORING_PROJECT: ${MONITORING_PROJECT:?set MONITORING_PROJECT in .env}
      CLICKHOUSE_COLLECTOR_PASSWORD: ${CLICKHOUSE_COLLECTOR_PASSWORD:?set CLICKHOUSE_COLLECTOR_PASSWORD in .env}
      CLICKHOUSE_GRAFANA_PASSWORD: ${CLICKHOUSE_GRAFANA_PASSWORD:?set CLICKHOUSE_GRAFANA_PASSWORD in .env}
      GRAFANA_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GRAFANA_METRICS_PASSWORD: ${GRAFANA_METRICS_PASSWORD:?set GRAFANA_METRICS_PASSWORD in .env}
    restart: "no"
    volumes:
      - grafana-metrics-auth:/etc/prometheus/secrets
    deploy:
      resources:
        limits:
          memory: 32m
    networks:
      - monitoring-net

  clickhouse:
    image: clickhouse/clickhouse-server:26.10.4.207
    restart: unless-stopped
    depends_on:
      check-env:
        condition: service_completed_successfully
    environment:
      CLICKHOUSE_DB: otel
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
      CLICKHOUSE_COLLECTOR_PASSWORD: ${CLICKHOUSE_COLLECTOR_PASSWORD:?set CLICKHOUSE_COLLECTOR_PASSWORD in .env}
      CLICKHOUSE_GRAFANA_PASSWORD: ${CLICKHOUSE_GRAFANA_PASSWORD:?set CLICKHOUSE_GRAFANA_PASSWORD in .env}
      CLICKHOUSE_MAX_SERVER_MEMORY_BYTES: ${CLICKHOUSE_MAX_SERVER_MEMORY_BYTES:-805306368}
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
      - ./clickhouse/config.d:/etc/clickhouse-server/config.d:ro
      - ./clickhouse/users.d/users.xml:/etc/clickhouse-server/users.d/users.xml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping | grep -q 'Ok.'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    deploy:
      resources:
        limits:
          memory: ${CLICKHOUSE_MEMORY_LIMIT:-768m}
    networks:
      - monitoring-net

  clickhouse-init:
    image: clickhouse/clickhouse-server:26.10.4.207
    restart: "no"
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      CLICKHOUSE_COLLECTOR_PASSWORD: ${CLICKHOUSE_COLLECTOR_PASSWORD:?set CLICKHOUSE_COLLECTOR_PASSWORD in .env}
      CLICKHOUSE_GRAFANA_PASSWORD: ${CLICKHOUSE_GRAFANA_PASSWORD:?set CLICKHOUSE_GRAFANA_PASSWORD in .env}
      TRACES_TTL_DAYS: ${TRACES_TTL_DAYS:-7}
      LOGS_TTL_DAYS: ${LOGS_TTL_DAYS:-14}
    volumes:
      - ./clickhouse/init:/init:ro
      - ./scripts/clickhouse-init.sh:/clickhouse-init.sh:ro
    entrypoint: ["/bin/bash", "/clickhouse-init.sh"]
    deploy:
      resources:
        limits:
          memory: 128m
    networks:
      - monitoring-net

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.165.0
    restart: unless-stopped
    depends_on:
      check-env:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
      clickhouse-init:
        condition: service_completed_successfully
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    environment:
      HOST_NAME: ${HOST_NAME:-product-host}
      MONITORING_PROJECT: ${MONITORING_PROJECT:?set MONITORING_PROJECT in .env}
      CLICKHOUSE_ENDPOINT: tcp://clickhouse:9000?dial_timeout=10s
      CLICKHOUSE_COLLECTOR_PASSWORD: ${CLICKHOUSE_COLLECTOR_PASSWORD:?set CLICKHOUSE_COLLECTOR_PASSWORD in .env}
      PROMETHEUS_OTLP_ENDPOINT: http://prometheus:9090/api/v1/otlp
    volumes:
      - ./otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "${OTLP_BIND_ADDR:-127.0.0.1}:${OTLP_GRPC_PORT:?set OTLP_GRPC_PORT in .env}:4317"
      - "${OTLP_BIND_ADDR:-127.0.0.1}:${OTLP_HTTP_PORT:?set OTLP_HTTP_PORT in .env}:4318"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:13133/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: ${OTEL_COLLECTOR_MEMORY_LIMIT:-192m}
    networks:
      monitoring-net:
        aliases:
          - otel-collector

  prometheus:
    image: prom/prometheus:v3.16.0
    restart: unless-stopped
    depends_on:
      check-env:
        condition: service_completed_successfully
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-2GB}
      - --web.enable-lifecycle
      - --web.enable-otlp-receiver
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - grafana-metrics-auth:/etc/prometheus/secrets:ro
      - prometheus-data:/prometheus
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:9090/-/healthy | grep -q 'Prometheus Server is Healthy.'",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: ${PROMETHEUS_MEMORY_LIMIT:-256m}
    networks:
      - monitoring-net

  grafana:
    image: grafana/grafana:13.3.1
    restart: unless-stopped
    depends_on:
      check-env:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://127.0.0.1:${GRAFANA_PORT:?set GRAFANA_PORT in .env}/}
      GF_METRICS_BASIC_AUTH_USERNAME: prometheus
      GF_METRICS_BASIC_AUTH_PASSWORD: ${GRAFANA_METRICS_PASSWORD:?set GRAFANA_METRICS_PASSWORD in .env}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_SNAPSHOTS_EXTERNAL_ENABLED: "false"
      GF_PUBLIC_DASHBOARDS_ENABLED: "false"
      GF_PLUGINS_PLUGIN_ADMIN_ENABLED: "false"
      GF_PLUGINS_PREINSTALL: grafana-clickhouse-datasource@4.23.5
      CLICKHOUSE_GRAFANA_PASSWORD: ${CLICKHOUSE_GRAFANA_PASSWORD:?set CLICKHOUSE_GRAFANA_PASSWORD in .env}
      MONITORING_PROJECT: ${MONITORING_PROJECT:?set MONITORING_PROJECT in .env}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/provisioning/alerting:/etc/grafana/provisioning/alerting:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./grafana/dashboards-project:/var/lib/grafana/dashboards-project:ro
    ports:
      - "${GRAFANA_BIND_ADDR:-127.0.0.1}:${GRAFANA_PORT:?set GRAFANA_PORT in .env}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health | grep -q 'ok'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: ${GRAFANA_MEMORY_LIMIT:-256m}
    networks:
      - monitoring-net

  node-exporter:
    image: prom/node-exporter:v1.13.1
    profiles: ["host"]
    restart: unless-stopped
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host/root
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|run/docker/netns|var/lib/docker/.+)($$|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro,rslave
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9100/metrics >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 64m
    networks:
      - monitoring-net

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.21.1
    profiles: ["postgres"]
    restart: unless-stopped
    # v0.21 deprecates DATA_SOURCE_URI. Keep credentials in the supported
    # DATA_SOURCE_USER/DATA_SOURCE_PASS environment variables, not argv.
    command:
      - --config.file=
      - --datasource.uri=${POSTGRES_EXPORTER_DSN:-postgres:5432/booking?sslmode=disable}
      - ${POSTGRES_EXPORTER_WRAP_LARGE_COUNTERS_FLAG:---wrap-large-counters}
    environment:
      DATA_SOURCE_USER: ${POSTGRES_EXPORTER_USER:-monitoring_readonly}
      DATA_SOURCE_PASS: ${POSTGRES_EXPORTER_PASSWORD:-}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9187/metrics >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 64m
    networks:
      - monitoring-net

volumes:
  clickhouse-data:
  clickhouse-logs:
  prometheus-data:
  grafana-data:
  grafana-metrics-auth:

networks:
  monitoring-net:
    name: ${MONITORING_PROJECT:?set MONITORING_PROJECT in .env}-monitoring-net
